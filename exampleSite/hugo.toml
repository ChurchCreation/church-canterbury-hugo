baseURL = 'https://example.com/'
locale = 'en-GB'
title = "St Botolph's, Barwick"
theme = 'church-canterbury-hugo'

# The runtime in static/core/js/ resolves the current nav link and the config
# file from a flat .html path, so keep Hugo's URLs flat too.
uglyURLs = true

disableHugoGeneratorInject = true

[security]
  # The pages are HTML, not Markdown. Hugo has excluded text/html content from
  # the default policy since 0.150, so a theme built from HTML must say so.
  allowContent = ['^text/html$', '^text/markdown$']

[markup.goldmark.renderer]
  unsafe = true
